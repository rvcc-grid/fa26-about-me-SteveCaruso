<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Isometra&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <!-- The body element contains all stuff shown to a visitor -->

    <header>
        <!-- The header shows the logo and the page title -->
        <img src="img/bob.svg" alt="A blue origami bird">
        <h1>About Me</h1>
    </header>

    <main>
        <!-- The main tag envelops important page content -->
        <section id="hero">
            <!-- hero section: shows profile image, name, & location -->
            <img src="img/avataaars.png" alt="It's a-me! Professor Caruso!">
            <div>
                <p>Steve Caruso</p>
                <p>Hopewell Township, NJ</p>
            </div>
        </section>

        <section id="bio">
            <!-- bio section: not to personal! -->
            <p>I want to be...</p>
            <ul>
                <li>A farmer</li>
                <li>Not famous</li>
                <li>On vacation</li>
            </ul>
        </section>

    </main>

    <footer>
        &copy; 2026 Steve Caruso
    </footer>

</body>

</html>
